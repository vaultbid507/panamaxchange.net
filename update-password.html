<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f7fb;

            font-family:
                Arial,
                sans-serif;

        }


        .card {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 32px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);

        }


        h1 {

            margin-top: 0;

            margin-bottom: 8px;

        }


        p {

            color: #64748b;

        }


        label {

            display: block;

            font-weight: 600;

            margin:
                18px 0 7px;

        }


        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;

        }


        button {

            width: 100%;

            margin-top: 22px;

            padding: 13px;

            border: 0;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        #message {

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            display: none;

        }


        #message.success {

            display: block;

            background: #dcfce7;

            color: #166534;

        }


        #message.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

        }


        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="card">

    <h1>
        Reset Password
    </h1>

    <p>
        Enter your new admin password.
    </p>


    <form id="resetForm">


        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            minlength="8"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            minlength="8"
            required
        >


        <button
            type="submit"
            id="resetButton"
        >
            Update Password
        </button>


    </form>


    <div id="message"></div>


    <a
        href="admin.html"
        class="back"
    >
        Back to Admin Login
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://tagbxmpizwlvgddgcpcl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_X36Iq53rm8U8HBkBfL06Vw_zErQRHK0";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "resetForm"
    );


const newPassword =
    document.getElementById(
        "newPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const message =
    document.getElementById(
        "message"
    );


// =====================================================
// PASSWORD UPDATE
// =====================================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const password =
            newPassword.value;


        const confirmation =
            confirmPassword.value;


        if (password.length < 8) {

            showMessage(
                "Password must be at least 8 characters.",
                "error"
            );

            return;

        }


        if (
            password !==
            confirmation
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Updating...";


        try {

            const {
                error
            } =
                await supabaseClient.auth
                    .updateUser({
                        password:
                            password
                    });


            if (error) {

                throw error;

            }


            showMessage(
                "Password updated successfully.",
                "success"
            );


            form.reset();


            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                2000
            );


        } catch (error) {

            console.error(
                "UPDATE PASSWORD ERROR:",
                error
            );


            showMessage(
                error.message,
                "error"
            );

        }


        resetButton.disabled =
            false;

        resetButton.textContent =
            "Update Password";

    }
);


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        type;

}

</script>


</body>

</html>
