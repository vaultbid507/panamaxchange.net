
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Admin Password
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #f5f7fb;

            font-family:
                Arial,
                sans-serif;

            color:
                #111827;

        }


        .reset-card {

            width: 100%;

            max-width: 430px;

            background:
                #ffffff;

            border-radius:
                16px;

            padding:
                32px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.08);

        }


        h1 {

            margin:
                0 0 8px;

            font-size:
                26px;

        }


        .subtitle {

            color:
                #6b7280;

            margin-bottom:
                28px;

        }


        label {

            display:
                block;

            margin-bottom:
                7px;

            font-weight:
                600;

        }


        input {

            width:
                100%;

            padding:
                12px 14px;

            border:
                1px solid #d1d5db;

            border-radius:
                8px;

            font-size:
                16px;

            margin-bottom:
                16px;

        }


        button {

            width:
                100%;

            border:
                0;

            border-radius:
                8px;

            padding:
                13px;

            background:
                #2563eb;

            color:
                white;

            font-size:
                16px;

            font-weight:
                600;

            cursor:
                pointer;

        }


        button:hover {

            background:
                #1d4ed8;

        }


        button:disabled {

            opacity:
                .6;

            cursor:
                not-allowed;

        }


        .message {

            margin-top:
                16px;

            padding:
                12px;

            border-radius:
                8px;

            display:
                none;

        }


        .message.success {

            display:
                block;

            background:
                #dcfce7;

            color:
                #166534;

        }


        .message.error {

            display:
                block;

            background:
                #fee2e2;

            color:
                #991b1b;

        }


        .back {

            display:
                block;

            text-align:
                center;

            margin-top:
                20px;

            color:
                #2563eb;

            text-decoration:
                none;

        }

    </style>

</head>


<body>


    <div class="reset-card">


        <h1>
            Create New Password
        </h1>


        <p class="subtitle">
            Enter a new password for your admin account.
        </p>


        <form id="resetPasswordForm">


            <label
                for="newPassword"
            >
                New Password
            </label>


            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="8"
                required
            >


            <label
                for="confirmPassword"
            >
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
            >


            <button
                type="submit"
                id="resetPasswordBtn"
            >
                Update Password
            </button>


        </form>


        <div
            id="resetMessage"
            class="message"
        ></div>


        <a
            href="admin.html"
            class="back"
        >
            Back to Admin Login
        </a>


    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // =====================================================
        // SUPABASE CONFIG
        // =====================================================

        const SUPABASE_URL =
            "YOUR_SUPABASE_URL";


        const SUPABASE_PUBLISHABLE_KEY =
            "YOUR_SUPABASE_PUBLISHABLE_KEY";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =====================================================
        // ELEMENTS
        // =====================================================

        const form =
            document.getElementById(
                "resetPasswordForm"
            );


        const newPassword =
            document.getElementById(
                "newPassword"
            );


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );


        const resetButton =
            document.getElementById(
                "resetPasswordBtn"
            );


        const message =
            document.getElementById(
                "resetMessage"
            );


        // =====================================================
        // RESET PASSWORD
        // =====================================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const password =
                    newPassword.value;


                const confirmation =
                    confirmPassword.value;


                if (
                    password.length < 8
                ) {

                    showMessage(
                        "Password must be at least 8 characters.",
                        "error"
                    );

                    return;

                }


                if (
                    password !==
                    confirmation
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }


                resetButton.disabled =
                    true;


                resetButton.textContent =
                    "Updating...";


                try {


                    const {
                        error
                    } =
                        await supabaseClient.auth
                            .updateUser({
                                password:
                                    password
                            });


                    if (error) {

                        throw error;

                    }


                    showMessage(
                        "Password updated successfully. You can now log in.",
                        "success"
                    );


                    form.reset();


                    setTimeout(
                        function() {

                            window.location.href =
                                "admin.html";

                        },
                        2000
                    );


                } catch (error) {


                    console.error(
                        "Password update error:",
                        error
                    );


                    showMessage(
                        error.message,
                        "error"
                    );


                }


                resetButton.disabled =
                    false;


                resetButton.textContent =
                    "Update Password";

            }
        );


        // =====================================================
        // MESSAGE
        // =====================================================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " +
                type;

        }

    </script>


</body>

</html>
