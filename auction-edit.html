<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>PanamaXChange — Edit Auction</title>
  <link rel="stylesheet" href="admin.css?v=20260819-01">
  <link rel="stylesheet" href="auction-admin.css?v=20260819-01">
  <style>
    .edit-shell{max-width:1180px;margin:auto;padding:28px}
    .edit-header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}
    .edit-brand{font-size:24px;font-weight:800}.edit-brand span{color:#2563eb}.edit-sub{color:#64748b;margin-top:4px}
    .edit-card{background:#fff;border:1px solid #e1e8f0;border-radius:16px;padding:24px;box-shadow:0 8px 28px rgba(15,23,42,.05)}
    .edit-form{display:grid;gap:18px}.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .edit-form label{display:block;font-size:13px;font-weight:700;color:#475569;margin-bottom:7px}.edit-form input,.edit-form textarea,.edit-form select{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d7e0eb;border-radius:10px;background:#fff;font:inherit}
    .edit-form textarea{min-height:120px;resize:vertical}.field-wide{grid-column:1/-1}.edit-actions{display:flex;gap:10px;flex-wrap:wrap}.message{min-height:22px}.message.success{color:#087f78}.message.error{color:#b42318}
    @media(max-width:760px){.edit-shell{padding:16px}.edit-header{align-items:flex-start;flex-direction:column}.edit-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="auction-page">
  <main class="edit-shell">
    <header class="edit-header">
      <div>
        <div class="edit-brand">Panama<span>X</span>Change</div>
        <div class="edit-sub">Edit auction</div>
      </div>
      <div class="actions">
        <a class="btn" href="auctions-admin.html?v=20260819-01">← Back to auctions</a>
        <button class="btn" id="logout" type="button">Sign out</button>
      </div>
    </header>

    <section class="edit-card">
      <div class="page-heading" style="margin-bottom:18px">
        <div>
          <span class="eyebrow">AUCTION MANAGEMENT</span>
          <h2 id="pageTitle">Edit auction</h2>
          <p id="pageSubtitle">Update the auction details and save the changes.</p>
        </div>
      </div>

      <form id="auctionEditForm" class="edit-form">
        <div class="edit-grid">
          <div>
            <label for="productId">Product</label>
            <select id="productId" required><option value="">Loading products...</option></select>
          </div>
          <div>
            <label for="status">Status</label>
            <select id="status">
              <option value="scheduled">Scheduled</option>
              <option value="live">Live</option>
              <option value="cancelled">Cancelled</option>
              <option value="ended">Ended</option>
            </select>
          </div>
          <div class="field-wide">
            <label for="title">Auction title</label>
            <input id="title" maxlength="160" required>
          </div>
          <div class="field-wide">
            <label for="description">Description</label>
            <textarea id="description"></textarea>
          </div>
          <div>
            <label for="startsAt">Starts</label>
            <input id="startsAt" type="datetime-local" required>
          </div>
          <div>
            <label for="endsAt">Ends</label>
            <input id="endsAt" type="datetime-local" required>
          </div>
          <div>
            <label for="startingBid">Starting bid</label>
            <input id="startingBid" type="number" min="0" step="0.01" required>
          </div>
          <div>
            <label for="increment">Minimum increment</label>
            <input id="increment" type="number" min="0.01" step="0.01" required>
          </div>
        </div>
        <div class="edit-actions">
          <button class="btn primary" id="saveAuction" type="submit">Save changes</button>
          <a class="btn" href="auctions-admin.html?v=20260819-01">Cancel</a>
        </div>
        <div id="message" class="message" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auction-edit.js?v=20260819-01"></script>
</body>
</html>
