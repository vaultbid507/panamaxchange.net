<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — Order Management</title><link rel="stylesheet" href="admin.css?v=20260815-11"><style>.orders-page{min-height:100vh;background:#f6f9fc;color:#142033}.orders-shell{max-width:1400px;margin:auto;padding:28px}.orders-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.orders-brand{font-size:24px;font-weight:800}.orders-brand span{color:#2563eb}.orders-sub{color:#64748b;margin-top:5px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px 14px;border:1px solid #d7e0eb;border-radius:10px;background:#fff}.toolbar input{min-width:280px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.card small{display:block;color:#64748b}.card strong{display:block;font-size:26px;margin-top:7px}.table-card{overflow:auto}.orders-table{width:100%;border-collapse:collapse;background:#fff}.orders-table th,.orders-table td{padding:15px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}.orders-table th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}.muted{display:block;color:#718096;font-size:12px;margin-top:4px}.status{padding:6px 10px;border-radius:999px;border:1px solid #d7e0eb;background:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d5deea;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}.edit-input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.editing{background:#f8fbff}.empty{text-align:center;padding:45px;color:#64748b}.error{padding:20px;color:#b42318;background:#fff1f2;border-radius:10px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.orders-shell{padding:16px}.orders-header{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body class="orders-page"><main class="orders-shell"><header class="orders-header"><div><div class="orders-brand">Panama<span>X</span>Change</div><div class="orders-sub">Professional order management</div></div><div class="actions"><a class="btn" href="admin.html">← Admin dashboard</a><button class="btn" id="logout" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total orders</small><strong id="total">0</strong></div><div class="card"><small>Pending</small><strong id="pending">0</strong></div><div class="card"><small>Processing</small><strong id="processing">0</strong></div><div class="card"><small>Revenue</small><strong id="revenue">$0.00</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search order, customer or email"><select id="filter"><option value="">All statuses</option><option>pending</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select><button class="btn" id="refresh" type="button">Refresh</button></div><div class="table-card"><table class="orders-table"><thead><tr><th>Order</th><th>Customer</th><th>Address</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading orders...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="orders-admin.js?v=20260815-11"></script></body></html>
