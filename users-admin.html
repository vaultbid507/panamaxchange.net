<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — User Management</title><link rel="stylesheet" href="admin.css?v=20260818-14"><style>.users-page{min-height:100vh;background:#f6f9fc;color:#142033}.users-shell{max-width:1400px;margin:auto;padding:28px}.users-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.users-brand{font-size:24px;font-weight:800}.users-brand span{color:#2563eb}.users-sub{color:#64748b;margin-top:5px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px 14px;border:1px solid #d7e0eb;border-radius:10px;background:#fff}.toolbar input{min-width:280px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.card small{display:block;color:#64748b}.card strong{display:block;font-size:26px;margin-top:7px}.table-card{overflow:auto}.users-table{width:100%;border-collapse:collapse;background:#fff}.users-table th,.users-table td{padding:15px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}.users-table th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}.role-pill{padding:6px 10px;border-radius:999px;border:1px solid #d7e0eb;background:#fff;font-size:12px;font-weight:700}.role-admin{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}.role-moderator{color:#7c3aed;background:#f5f3ff;border-color:#ddd6fe}.role-user{color:#475569;background:#f8fafc}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d5deea;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}.empty{text-align:center;padding:45px;color:#64748b}.error{padding:20px;color:#b42318;background:#fff1f2;border-radius:10px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.users-shell{padding:16px}.users-header{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body class="users-page"><main class="users-shell"><header class="users-header"><div><div class="users-brand">Panama<span>X</span>Change</div><div class="users-sub">Professional user management</div></div><div class="actions"><a class="btn" href="admin.html?v=20260818-100">← Admin dashboard</a><button class="btn" id="logout" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total users</small><strong id="total">0</strong></div><div class="card"><small>Administrators</small><strong id="admins">0</strong></div><div class="card"><small>Recently active</small><strong id="active">0</strong></div><div class="card"><small>Moderators</small><strong id="moderators">0</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search user or email"><select id="role"><option value="">All roles</option><option value="admin">Administrators</option><option value="moderator">Moderators</option><option value="registered">Registered users</option></select><button class="btn" id="refresh" type="button">Refresh</button></div><div class="table-card"><table class="users-table"><thead><tr><th>User</th><th>Email</th><th>Created</th><th>Last sign in</th><th>Role</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading users...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="users-admin.js?v=20260818-17"></script></body></html>
