<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — User Management</title><link rel="stylesheet" href="admin.css?v=20260815-15"><style>body{margin:0;background:#f6f9fc;color:#142033;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:20px}.brand{font-size:24px;font-weight:800}.brand span{color:#2563eb}.muted{color:#64748b}.btn{border:1px solid #d5deea;background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:650;text-decoration:none;color:inherit}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#b42318}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select,.edit{padding:10px;border:1px solid #d7e0eb;border-radius:9px;background:#fff}.toolbar input{min-width:290px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px #0f172a0a}.card small{color:#64748b}.card strong{display:block;font-size:26px;margin-top:6px}.table-wrap{overflow:auto;background:#fff;border:1px solid #e1e8f0;border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;border-bottom:1px solid #edf1f5;text-align:left}.table th{background:#f8fafc;color:#64748b;font-size:12px;text-transform:uppercase}.actions{display:flex;gap:7px;flex-wrap:wrap}.edit{width:100%;box-sizing:border-box}.empty{text-align:center;padding:45px;color:#64748b}.error{padding:20px;color:#b42318}.role{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef4ff;color:#2563eb;font-size:12px;font-weight:700}@media(max-width:700px){.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">Panama<span>X</span>Change</div><h1>User Management</h1><p class="muted">Professional customer account management.</p></div><div class="actions"><a class="btn" href="admin.html">← Admin dashboard</a><button id="logout" class="btn">Sign out</button></div></header><section class="cards"><div class="card"><small>Total users</small><strong id="total">0</strong></div><div class="card"><small>Administrators</small><strong id="admins">0</strong></div><div class="card"><small>Recently active</small><strong id="active">0</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search by name or email"><select id="role"><option value="">All roles</option><option value="admin">Administrators</option><option value="user">Users</option></select><button id="refresh" class="btn">Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Email</th><th>Created</th><th>Last sign in</th><th>Role</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading users...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="users-admin.js?v=20260815-15"></script></body></html>
