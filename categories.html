<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="robots" content="noindex"><title>PanamaXChange — Category Management</title><link rel="stylesheet" href="admin.css?v=20260818-09"><style>.status{padding:12px;border-radius:9px;margin:12px 0;background:#f8fafc}.error{background:#fff1f2;color:#b42318}.ok{background:#ecfdf3;color:#047857}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:40px;color:#64748b}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{min-width:280px}.inline{display:flex;gap:7px}.inline input{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px}.btn:disabled{opacity:.6;cursor:wait}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">Panama<span>X</span>Change</div><h1>Category Management</h1><p class="muted">Professional storefront category management.</p></div><div class="actions"><a class="btn" href="admin.html?v=20260818-09">← Admin dashboard</a><button id="logout" class="btn" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total categories</small><strong id="total">0</strong></div><div class="card"><small>Active categories</small><strong id="active">0</strong></div><div class="card"><small>Catalog organization</small><strong>100%</strong></div></section><div id="status" class="status ok">Connecting to live categories…</div><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search categories"><button id="add" class="btn primary" type="button">+ Add category</button><button id="refresh" class="btn" type="button">Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th>Slug</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Loading categories…</td></tr></tbody></table></div></section></main><script>(function(){'use strict';const API='https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhZ2J4bXBpendsdmdkZGdjcGNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjczNDEsImV4cCI6MjEwMjI0MzM0MX0.wOtr8Mxqz79BuXY1nMC0fbR0iAkuC3j282opFR9oZi0',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])),wait=async(p,ms=10000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Request timed out.')),ms))]);let rows=[],editing=null,busy=false;function token(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.endsWith('-auth-token'))continue;const v=JSON.parse(localStorage.getItem(k));if(v&&v.access_token)return v.access_token}}catch(e){}return null}function headers(write=false){const h={apikey:KEY,Accept:'application/json'};const t=token();if(t)h.Authorization='Bearer '+t;if(write)h['Content-Type']='application/json';return h}async function req(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(url,{...opt,headers:{...headers(!!opt.body),...(opt.headers||{})},signal:c.signal});const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch(e){}if(!r.ok)throw new Error(d?.message||d?.hint||text||('HTTP '+r.status));return d}finally{clearTimeout(t)}}function render(){const q=$('search').value.trim().toLowerCase(),list=rows.filter(x=>(String(x.name||'')+' '+String(x.slug||'')).toLowerCase().includes(q));$('rows').innerHTML=list.length?list.map(x=>editing===String(x.id)?`<tr><td><input data-name value="${esc(x.name)}"></td><td><input data-slug value="${esc(x.slug)}"></td><td><div class="actions"><button class="btn primary" data-save="${x.id}">Save</button><button class="btn" data-cancel>Cancel</button></div></td></tr>`:`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.slug)}</td><td><div class="actions"><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-remove="${x.id}">Remove</button></div></td></tr>`).join(''):'<tr><td colspan="3" class="empty">No categories found.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=String(b.dataset.edit);render()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editing=null;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(b.dataset.remove))}async function load(){if(busy)return;busy=true;$('rows').innerHTML='<tr><td colspan="3" class="empty">Loading categories…</td></tr>';$('status').textContent='Loading live categories…';try{rows=await req(API+'/categories?select=id,name,slug&order=name.asc')||[];$('total').textContent=rows.length;$('active').textContent=rows.length;render();$('status').textContent='Live data connected · '+rows.length+' categories';$('status').className='status ok'}catch(e){$('rows').innerHTML='<tr><td colspan="3" class="error">Unable to load categories: '+esc(e.name==='AbortError'?'Request timed out':e.message)+'</td></tr>';$('status').textContent='Category data error: '+(e.message||e);$('status').className='status error'}finally{busy=false}}async function save(id){const tr=[...document.querySelectorAll('tr')].find(x=>x.querySelector('[data-save="'+id+'"]')),name=tr?.querySelector('[data-name]')?.value.trim(),slug=tr?.querySelector('[data-slug]')?.value.trim();if(!name||!slug)return alert('Name and slug are required.');try{await req(API+'/rpc/admin_update_category',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({p_id:Number(id),p_name:name,p_slug:slug})});editing=null;await load()}catch(e){alert('Unable to update category: '+e.message)}}async function remove(id){if(!confirm('Delete this category? This action cannot be undone.'))return;try{await req(API+'/rpc/admin_delete_category',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({p_id:Number(id)})});await load()}catch(e){alert('Unable to remove category: '+e.message)}}$('search').oninput=render;$('refresh').onclick=load;$('add').onclick=async()=>{const name=prompt('Category name:');if(!name?.trim())return;const slug=prompt('Category slug:',name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));if(!slug?.trim())return;try{await req(API+'/rpc/admin_create_category',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({p_name:name.trim(),p_slug:slug.trim()})});await load()}catch(e){alert('Unable to add category: '+e.message)}}$('logout').onclick=async()=>{try{const t=token();if(t)await fetch('https://tagbxmpizwlvgddgcpcl.supabase.co/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t}})}catch(e){}for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i)||'';if(k.endsWith('-auth-token'))localStorage.removeItem(k)}location.replace('admin.html?logout='+Date.now())};load()})();</script></body></html>
