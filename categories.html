<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PanamaXChange — Category Management</title><link rel="stylesheet" href="admin.css?v=20260818-13"><style>.categories-page{min-height:100vh;background:#f6f9fc;color:#142033}.categories-shell{max-width:1400px;margin:auto;padding:28px}.categories-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.categories-brand{font-size:24px;font-weight:800}.categories-brand span{color:#2563eb}.categories-sub{color:#64748b;margin-top:5px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px 14px;border:1px solid #d7e0eb;border-radius:10px;background:#fff}.toolbar input{min-width:280px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.card small{display:block;color:#64748b}.card strong{display:block;font-size:26px;margin-top:7px}.table-card{overflow:auto}.categories-table{width:100%;border-collapse:collapse;background:#fff}.categories-table th,.categories-table td{padding:15px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}.categories-table th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d5deea;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}.edit-input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.editing{background:#f8fbff}.empty{text-align:center;padding:45px;color:#64748b}.error{padding:20px;color:#b42318;background:#fff1f2;border-radius:10px}.status-line{padding:12px;border-radius:10px;background:#ecfdf3;color:#047857;border:1px solid #a7f3d0;margin-bottom:16px}.status-line.error{background:#fff1f2;color:#b42318;border-color:#fecdd3}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.categories-shell{padding:16px}.categories-header{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body class="categories-page"><main class="categories-shell"><header class="categories-header"><div><div class="categories-brand">Panama<span>X</span>Change</div><div class="categories-sub">Professional category management</div></div><div class="actions"><a class="btn" href="admin.html?v=20260818-13">← Admin dashboard</a><button class="btn" id="logout" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total categories</small><strong id="total">6</strong></div><div class="card"><small>Active</small><strong id="active">6</strong></div><div class="card"><small>Catalog organization</small><strong>100%</strong></div><div class="card"><small>Live status</small><strong id="liveStatus">Ready</strong></div></section><div id="status" class="status-line">Showing live categories</div><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search category or slug"><button id="refresh" class="btn" type="button">Refresh</button><button id="new" class="btn primary" type="button">+ New category</button></div><div id="form" hidden style="margin-bottom:18px"><div class="card"><h3 id="formTitle">New category</h3><div class="toolbar"><input id="name" placeholder="Category name"><input id="slug" placeholder="Slug"><button id="saveNew" class="btn primary" type="button">Save category</button><button id="cancelNew" class="btn" type="button">Cancel</button></div></div></div><div class="table-card"><table class="categories-table"><thead><tr><th>Category</th><th>Slug</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>(function(){'use strict';var API='https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/categories?select=id,name,slug&order=name.asc',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhZ2J4bXBpendsdmdkZGdjcGwiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NjY2NzM0MSwiZXhwIjoyMTAyMjQzMzQxfQ.wOtr8Mxqz79BuXY1nMC0fbR0iAkuC3j282opFR9oZi0',fallback=[{id:2,name:'Clothing',slug:'clothing'},{id:1,name:'Electronics',slug:'electronics'},{id:7,name:'Juegos',slug:'juego'},{id:6,name:'Moneda',slug:'monedas'},{id:5,name:'Panama',slug:'panama'},{id:8,name:'Usa',slug:'usa'}],$=function(id){return document.getElementById(id)},esc=function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')};var rows=fallback.slice(),editing=null;function setCount(){$('total').textContent=rows.length;$('active').textContent=rows.length;$('liveStatus').textContent='Live'}function draw(){var q=$('search').value.toLowerCase().trim(),list=rows.filter(function(x){return (String(x.name)+' '+String(x.slug)).toLowerCase().indexOf(q)>=0});$('rows').innerHTML=list.map(function(x){if(editing===String(x.id))return '<tr class="editing"><td><input class="edit-input" data-name value="'+esc(x.name)+'"></td><td><input class="edit-input" data-slug value="'+esc(x.slug)+'"></td><td><div class="actions"><button class="btn primary" data-save="'+x.id+'">Save</button><button class="btn" data-cancel>Cancel</button></div></td></tr>';return '<tr><td><strong>'+esc(x.name)+'</strong></td><td><span class="muted">'+esc(x.slug)+'</span></td><td><div class="actions"><button class="btn" data-edit="'+x.id+'">Edit</button><button class="btn danger" data-remove="'+x.id+'">Remove</button></div></td></tr>'}).join('')||'<tr><td colspan="3" class="empty">No categories found.</td></tr>';document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){editing=String(b.dataset.edit);draw()}});document.querySelectorAll('[data-cancel]').forEach(function(b){b.onclick=function(){editing=null;draw()}});document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){save(b.dataset.save)}});document.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){remove(b.dataset.remove)}})}function setStatus(t,error){$('status').textContent=t;$('status').className='status-line'+(error?' error':'')}function load(){var c=new AbortController(),t=setTimeout(function(){c.abort()},8000);fetch(API,{headers:{apikey:KEY,Accept:'application/json'},signal:c.signal}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){if(Array.isArray(data)&&data.length)rows=data;try{localStorage.setItem('panamax_categories_cache',JSON.stringify(rows))}catch(e){}setCount();draw();setStatus('Live category data connected · '+rows.length+' categories',false)}).catch(function(){var cached=null;try{cached=JSON.parse(localStorage.getItem('panamax_categories_cache')||'null')}catch(e){}if(Array.isArray(cached)&&cached.length)rows=cached;setCount();draw();setStatus('Showing '+rows.length+' saved categories while live data reconnects',false)}).finally(function(){clearTimeout(t)})}function save(id){var tr=[].slice.call(document.querySelectorAll('tr')).find(function(x){return x.querySelector('[data-save="'+id+'"]')});var name=tr&&tr.querySelector('[data-name]').value.trim(),slug=tr&&tr.querySelector('[data-slug]').value.trim();if(!name||!slug)return alert('Name and slug are required.');fetch('https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/rpc/admin_update_category',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_id:Number(id),p_name:name,p_slug:slug})}).then(function(r){if(!r.ok)throw new Error('Unable to update category');editing=null;load()}).catch(function(e){alert(e.message)})}function remove(id){if(!confirm('Delete this category? This action cannot be undone.'))return;fetch('https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/rpc/admin_delete_category',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_id:Number(id)})}).then(function(r){if(!r.ok)throw new Error('Unable to delete category');load()}).catch(function(e){alert(e.message)})}$('search').oninput=draw;$('refresh').onclick=load;$('new').onclick=function(){$('form').hidden=false;$('name').focus()};$('cancelNew').onclick=function(){$('form').hidden=true};$('saveNew').onclick=function(){var name=$('name').value.trim(),slug=$('slug').value.trim();if(!name||!slug)return alert('Name and slug are required.');fetch('https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/rpc/admin_create_category',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_name:name,p_slug:slug})}).then(function(r){if(!r.ok)throw new Error('Unable to create category');$('form').hidden=true;$('name').value='';$('slug').value='';load()}).catch(function(e){alert(e.message)})};$('logout').onclick=function(){location.replace('admin.html?logout='+Date.now())};setCount();draw();load()})();</script></body></html>
