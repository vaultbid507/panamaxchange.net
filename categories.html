<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PanamaXChange — Category Management</title><link rel="stylesheet" href="admin.css?v=20260818-11"><style>.status{padding:12px;border-radius:9px;margin:12px 0;background:#f8fafc}.ok{background:#ecfdf3;color:#047857}.error{background:#fff1f2;color:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:40px;color:#64748b}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{min-width:280px}.btn{cursor:pointer}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">Panama<span>X</span>Change</div><h1>Category Management</h1><p class="muted">Professional storefront category management.</p></div><div class="actions"><a class="btn" href="admin.html?v=20260818-11">← Admin dashboard</a><button id="logout" class="btn" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total categories</small><strong id="total">6</strong></div><div class="card"><small>Active categories</small><strong id="active">6</strong></div><div class="card"><small>Catalog organization</small><strong>100%</strong></div></section><div id="status" class="status ok">Live categories ready</div><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search categories"><button id="add" class="btn primary" type="button">+ Add category</button><button id="refresh" class="btn" type="button">Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th>Slug</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>var API='https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/categories?select=id,name,slug&order=name.asc';var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhZ2J4bXBpendsdmdkZGdjcGNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjczNDEsImV4cCI6MjEwMjI0MzM0MX0.wOtr8Mxqz79BuXY1nMC0fbR0iAkuC3j282opFR9oZi0';var fallback=[{id:2,name:'Clothing',slug:'clothing'},{id:1,name:'Electronics',slug:'electronics'},{id:7,name:'Juegos',slug:'juego'},{id:6,name:'Moneda',slug:'monedas'},{id:5,name:'Panama',slug:'panama'},{id:8,name:'Usa',slug:'usa'}];var rows=fallback.slice();var editing=null;function $(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function draw(){var q=$('search').value.toLowerCase().trim();var list=rows.filter(function(x){return (String(x.name)+' '+String(x.slug)).toLowerCase().indexOf(q)>=0});$('rows').innerHTML=list.length?list.map(function(x){if(editing===String(x.id)){return '<tr><td><input data-name value="'+esc(x.name)+'"></td><td><input data-slug value="'+esc(x.slug)+'"></td><td><button class="btn primary" data-save="'+x.id+'">Save</button> <button class="btn" data-cancel>Cancel</button></td></tr>'}return '<tr><td><strong>'+esc(x.name)+'</strong></td><td>'+esc(x.slug)+'</td><td><button class="btn" data-edit="'+x.id+'">Edit</button> <button class="btn danger" data-remove="'+x.id+'">Remove</button></td></tr>'}).join(''):'<tr><td colspan="3" class="empty">No categories found.</td></tr>';document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){editing=b.getAttribute('data-edit');draw()}});document.querySelectorAll('[data-cancel]').forEach(function(b){b.onclick=function(){editing=null;draw()}});document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){save(b.getAttribute('data-save'))}});document.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){remove(b.getAttribute('data-remove'))}})}function setCount(){ $('total').textContent=rows.length; $('active').textContent=rows.length }function renderData(data,live){rows=data;setCount();draw();$('status').textContent=live?'Live data connected · '+rows.length+' categories':'Offline fallback · showing last known categories';$('status').className='status '+(live?'ok':'error')}function load(){var ctrl=new AbortController();var timer=setTimeout(function(){ctrl.abort()},8000);fetch(API,{headers:{apikey:KEY,Accept:'application/json'},signal:ctrl.signal}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){renderData(data||[],true)}).catch(function(){renderData(rows,false)}).finally(function(){clearTimeout(timer)})}function save(id){var tr=[].slice.call(document.querySelectorAll('tr')).find(function(x){return x.querySelector('[data-save="'+id+'"]')});var name=tr&&tr.querySelector('[data-name]').value.trim();var slug=tr&&tr.querySelector('[data-slug]').value.trim();if(!name||!slug)return alert('Name and slug are required.');fetch('https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/rpc/admin_update_category',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({p_id:Number(id),p_name:name,p_slug:slug})}).then(function(r){if(!r.ok)throw new Error('Unable to update category');editing=null;load()}).catch(function(e){alert(e.message)})}function remove(id){if(!confirm('Delete this category? This action cannot be undone.'))return;fetch('https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/rpc/admin_delete_category',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({p_id:Number(id)})}).then(function(r){if(!r.ok)throw new Error('Unable to delete category');load()}).catch(function(e){alert(e.message)})}$('search').oninput=draw;$('refresh').onclick=load;$('add').onclick=function(){var name=prompt('Category name:');if(!name)return;var slug=prompt('Category slug:',name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));if(!slug)return;fetch('https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/rpc/admin_create_category',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({p_name:name.trim(),p_slug:slug.trim()})}).then(function(r){if(!r.ok)throw new Error('Unable to add category');load()}).catch(function(e){alert(e.message)})}$('logout').onclick=function(){location.replace('admin.html?logout='+Date.now())};draw();load();</script></body></html>
