<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — Category Management</title><link rel="stylesheet" href="admin.css?v=20260815-16"><style>body{margin:0;background:#f6f9fc;color:#142033;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1300px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.brand{font-size:24px;font-weight:800}.brand span{color:#2563eb}.muted{color:#64748b}.btn{border:1px solid #d5deea;background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:650;text-decoration:none;color:inherit}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#b42318}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.toolbar input{padding:11px 14px;border:1px solid #d7e0eb;border-radius:9px;min-width:300px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px #0f172a0a}.card small{color:#64748b}.card strong{display:block;font-size:26px;margin-top:6px}.table-wrap{overflow:auto;background:#fff;border:1px solid #e1e8f0;border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:15px;border-bottom:1px solid #edf1f5;text-align:left}.table th{background:#f8fafc;color:#64748b;font-size:12px;text-transform:uppercase}.actions{display:flex;gap:7px;flex-wrap:wrap}.edit{padding:9px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box}.editing{background:#f8fbff}.empty{text-align:center;padding:45px;color:#64748b}.error{text-align:center;padding:25px;color:#b42318}@media(max-width:650px){.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">Panama<span>X</span>Change</div><h1>Category Management</h1><p class="muted">Professional storefront category management.</p></div><div class="actions"><a class="btn" href="admin.html">← Admin dashboard</a><button id="logout" class="btn">Sign out</button></div></header><section class="cards"><div class="card"><small>Total categories</small><strong id="total">0</strong></div><div class="card"><small>Active categories</small><strong id="active">0</strong></div><div class="card"><small>Catalog organization</small><strong>100%</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search categories"><button id="add" class="btn primary" type="button">+ Add category</button><button id="refresh" class="btn" type="button">Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th>Slug</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Loading categories...</td></tr></tbody></table></div></section></main><div id="categoryModal" style="display:none;position:fixed;inset:0;background:#0f172a66;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:min(480px,100%)"><h2 id="modalTitle">Add category</h2><form id="categoryForm"><input id="categoryId" type="hidden"><p><label>Name</label><input id="name" required style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px"></p><p><label>Slug</label><input id="slug" required style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px"></p><div class="actions"><button type="button" id="clear" class="btn">Cancel</button><button type="submit" class="btn primary">Save category</button></div><div id="message" class="error"></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="categories-admin.js?v=20260815-16"></script></body></html>
