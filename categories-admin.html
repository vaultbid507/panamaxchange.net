ript>(async()=>{const URL='https://tagbxmpizwlvgddgcpcl.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhZ2J4bXBpendsdmdkZGdjcGNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjczNDEsImV4cCI6MjEwMjI0MzM0MX0.wOtr8Mxqz79BuXY1nMC0fbR0iAkuC3j282opFR9oZi0',q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])),state={rows:[],editing:null,busy:false},db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});function status(t,e=false){q('status').textContent=t;q('status').className='status '+(e?'error':'ok')}async function load(){if(state.busy)return;state.busy=true;q('rows').innerHTML='<tr><td colspan="3" class="empty">Loading categories...</td></tr>';status('Loading live categories…');try{const s=await db.auth.getSession();if(s.error)throw s.error;if(!s.data?.session){throw Error('No Admin session found. Please sign in from Admin dashboard first.')}const {data,error}=await db.from('categories').select('id,name,slug').order('name');if(error)throw error;state.rows=data||[];q('total').textContent=state.rows.length;q('active').textContent=state.rows.length;render();status('Live data connected · '+state.rows.length+' categories')}catch(e){q('rows').innerHTML='<tr><td colspan="3" class="error">Unable to load categories: '+esc(e.message||e)+'</td></tr>';status('Live data error: '+(e.message||e),true)}finally{state.busy=false}}function render(){const term=q('search').value.trim().toLowerCase(),list=state.rows.filter(x=>(String(x.name||'')+' '+String(x.slug||'')).toLowerCase().includes(term));q('rows').innerHTML=list.length?list.map(x=>state.editing===String(x.id)?'<tr><td><input data-name value="'+esc(x.name)+'"></td><td><input data-slug value="'+esc(x.slug)+'"></td><td><div class="actions"><button class="btn primary" data-save="'+x.id+'">Save</button><button class="btn" data-cancel>Cancel</button></div></td></tr>':'<tr><td><strong>'+esc(x.name)+'</strong></td><td>'+esc(x.slug)+'</td><td><div class="actions"><button class="btn" data-edit="'+x.id+'">Edit</button><button class="btn danger" data-remove="'+x.id+'">Remove</button></div></td></tr>').join(''):'<tr><td colspan="3" class="empty">No categories found.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.editing=b.dataset.edit;render()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{state.editing=null;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(b.dataset.remove))}async function save(id){const tr=[...document.querySelectorAll('tr')].find(x=>x.querySelector('[data-save="'+id+'"]'));const name=tr?.querySelector('[data-name]')?.value.trim(),slug=tr?.querySelector('[data-slug]')?.value.trim();if(!name||!slug)return alert('Name and slug are required.');const {error}=await db.from('categories').update({name,slug}).eq('id',id);if(error)return alert('Unable to update category: '+error.message);state.editing=null;await load()}async function remove(id){if(!confirm('Delete this category? This action cannot be undone.'))return;const {error}=await db.from('categories').delete().eq('id',id);if(error)return alert('Unable to remove category: '+error.message);await load()}q('search').oninput=render;q('refresh').onclick=load;q('add').onclick=async()=>{const name=prompt('Category name:');if(!name?.trim())return;const slug=prompt('Category slug:',name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));if(!slug?.trim())return;const {error}=await db.from('categories').insert({name:name.trim(),slug:slug.trim()});if(error)return alert('Unable to add category: '+error.message);await load()};q('logout').onclick=async()=>{await db.auth.signOut({scope:'local'});location.replace('admin.html?logout='+Date.now())};db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.replace('admin.html?auth='+Date.now())});load()})().catch(e=>{const r=document.getElementById('rows'),s=document.getElementById('status');if(r)r.innerHTML='<tr><td colspan="3" class="error">Unable to initialize: '+String(e.message||e)+'</td></tr>';if(s){s.textContent='Initialization error: '+String(e.message||e);s.className='status error'}});</script></body></html>
