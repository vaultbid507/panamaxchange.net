<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — Category Management</title><link rel="stylesheet" href="admin.css?v=20260815-14"><style>.page{min-height:100vh;background:#f6f9fc}.shell{max-width:1200px;margin:auto;padding:30px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.brand{font-size:24px;font-weight:800}.brand span{color:#2563eb}.sub{color:#64748b;margin-top:5px}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:20px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.card h2{margin-top:0}.form-group{margin-bottom:15px}.form-group label{display:block;font-weight:600;margin-bottom:7px}.form-group input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5deea;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d5deea;background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:600}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1;padding:11px;border:1px solid #d5deea;border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;border-bottom:1px solid #edf1f5;text-align:left}.table th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}.editing{background:#f8fbff}.inline-input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.empty{text-align:center;padding:35px;color:#64748b}.message{margin-top:12px;color:#b42318}@media(max-width:800px){.grid{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}}</style></head><body class="page"><main class="shell"><header class="head"><div><div class="brand">Panama<span>X</span>Change</div><div class="sub">Professional
