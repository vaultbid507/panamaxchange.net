<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="robots" content="noindex"><title>PanamaXChange — Category Management</title><link rel="stylesheet" href="admin.css?v=20260817-42"><style>.status{padding:12px;border-radius:9px;margin:12px 0;font-size:13px}.status.error{background:#fff1f2;color:#b42318;border:1px solid #fecdd3}.status.ok{background:#ecfdf3;color:#047857;border:1px solid #a7f3d0}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">Panama<span>X</span>Change</div><h1>Category Management</h1><p class="muted">Professional storefront category management.</p></div><div class="actions"><a class="btn" href="admin.html?v=20260817-42">← Admin dashboard</a><button id="logout" class="btn" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total categories</small><strong id="total">0</strong></div><div class="card"><small>Active categories</small><strong id="active">0</strong></div><div class="card"><small>Catalog organization</small><strong>100%</strong></div></section><div id="status" class="status ok">Connecting to live marketplace data…</div><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search categories"><button id="add" class="btn primary" type="button">+ Add category</button><button id="refresh" class="btn" type="button">Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th>Slug</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Connecting to marketplace...</td></tr></tbody></table></div></section></main><div id="categoryModal" style="display:none;position:fixed;inset:0;background:#0f172a66;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:min(480px,100%)"><h2>Add category</h2><form id="categoryForm"><p><label>Name</label><input id="name" required style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px"></p><p><label>Slug</label><input id="slug" required style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px"></p><div class="actions"><button type="button" id="clear" class="btn">Cancel</button><button type="submit" id="saveCategory" class="btn primary">Save category</button></div><div id="message" class="status"></div></form></div></div><script>(function(){'use strict';const API='https://tagbxmpizwlvgddgcpcl.supabase.co/rest/v1/categories',KEY='sb_publishable_X36Iq53rm8U8HBkBfL06Vw_zErQRHKbF0',q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])),state={rows:[],editing:null,busy:false};function token(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.includes('auth-token'))continue;try{const v=JSON.parse(localStorage.getItem(k));if(v&&v.access_token)return v.access_token;if(v&&v.currentSession&&v.currentSession.access_token)return v.currentSession.access_token}catch(_){}}return null}function headers(write=false){const h={'apikey':KEY,'Accept':'application/json'};const t=token();if(t)h.Authorization='Bearer '+t;if(write)h['Content-Type']='application/json';return h}async function request(url,opts={}){const c=new AbortController(),timer=setTimeout(()=>c.abort(),10000);try{const r=await fetch(url,{...opts,signal:c.signal,headers:{...headers(!!opts.body),...(opts.headers||{})}});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){}if(!r.ok){let msg=data?.message||data?.error_description||data?.hint||text||('HTTP '+r.status);throw new Error(msg)}return data}finally{clearTimeout(timer)}}function setStatus(text,error=false){const s=q('status');s.textContent=text;s.className='status '+(error?'error':'ok')}function render(){const term=q('search').value.trim().toLowerCase(),list=state.rows.filter(x=>(`${x.name||''} ${x.slug||''}`).toLowerCase().includes(term));q('rows').innerHTML=list.length?list.map(x=>state.editing===String(x.id)?`<tr><td><input data-name value="${esc(x.name)}"></td><td><input data-slug value="${esc(x.slug)}"></td><td><div class="actions"><button class="btn primary" data-save="${x.id}">Save</button><button class="btn" data-cancel>Cancel</button></div></td></tr>`:`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.slug)}</td><td><div class="actions"><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-remove="${x.id}">Remove</button></div></td></tr>`).join(''):'<tr><td colspan="3" class="empty">No categories found.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.editing=String(b.dataset.edit);render()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{state.editing=null;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(b.dataset.remove))}async function load(){if(state.busy)return;state.busy=true;q('rows').innerHTML='<tr><td colspan="3" class="empty">Loading categories...</td></tr>';setStatus('Loading live categories…');try{state.rows=await request(API+'?select=id,name,slug&order=name.asc')||[];q('total').textContent=state.rows.length;q('active').textContent=state.rows.length;state.editing=null;render();setStatus('Live data connected · '+state.rows.length+' categories')}catch(e){q('rows').innerHTML=`<tr><td colspan="3" class="error">Unable to load categories: ${esc(e.name==='AbortError'?'Request timed out':e.message)}</td></tr>`;setStatus('Live data error: '+(e.message||e),true)}finally{state.busy=false}}async function save(id){const tr=document.querySelector('tr:has([data-save])');const name=tr?.querySelector('[data-name]')?.value.trim(),slug=tr?.querySelector('[data-slug]')?.value.trim();if(!name||!slug)return alert('Name and slug are required.');try{await request(API+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name,slug})});state.editing=null;await load()}catch(e){alert('Unable to update category: '+e.message)}}async function remove(id){if(!confirm('Delete this category? This action cannot be undone.'))return;try{await request(API+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await load()}catch(e){alert('Unable to remove category: '+e.message)}}q('search').oninput=render;q('refresh').onclick=load;q('add').onclick=()=>{q('categoryModal').style.display='flex';q('name').focus()};q('clear').onclick=()=>q('categoryModal').style.display='none';q('categoryForm').onsubmit=async e=>{e.preventDefault();const name=q('name').value.trim(),slug=q('slug').value.trim();if(!name||!slug)return;q('saveCategory').disabled=true;q('message').textContent='Saving…';try{await request(API,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({name,slug})});q('categoryModal').style.display='none';q('name').value='';q('slug').value='';await load()}catch(x){q('message').textContent='Unable to save: '+x.message}finally{q('saveCategory').disabled=false}};q('logout').onclick=()=>{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i)||'';if(k.includes('auth-token'))localStorage.removeItem(k)}location.replace('admin.html?logout='+Date.now())};load()})();</script></body></html>
