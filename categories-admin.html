</td><td><button class="btn primary" data-save="'+x.id+'">Save</button> <button class="btn" data-cancel>Cancel</button></td></tr>':'<tr><td><strong>'+esc(x.name)+'</strong></td><td>'+esc(x.slug)+'</td><td><button class="btn" data-edit="'+x.id+'">Edit</button> <button class="btn danger" data-remove="'+x.id+'">Remove</button></td></tr>').join(''):'<tr><td colspan="3" class="empty">No categories found.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=String(b.dataset.edit);render()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editing=null;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),name=tr.querySelector('[data-name]').value.trim(),slug=tr.querySelector('[data-slug]').value.trim();if(!name||!slug)return alert('Name and slug are required.');b.disabled=true;const r=await timeout(db.from('categories').update({name,slug}).eq('id',b.dataset.save));if(r.error)return alert(r.error.message);editing=null;load()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this category? This action cannot be undone.'))return;const r=await timeout(db.from('categories').delete().eq('id',b.dataset.remove));if(r.error)return alert(r.error.message);load()})}q('search').oninput=render;q('refresh').onclick=load;q('logout').onclick=async()=>{try{await timeout(db.auth.signOut({scope:'local'}),5000)}finally{location.replace('admin.html?logout='+Date.now())}};q('add').onclick=()=>{q('categoryModal').style.display='flex';q('name').focus()};q('clear').onclick=()=>q('categoryModal').style.display='none';q('categoryForm').onsubmit=async e=>{e.preventDefault();const name=q('name').value.trim(),slug=q('slug').value.trim();if(!name||!slug)return;q('message').textContent='Saving...';const r=await timeout(db.from('categories').insert({name,slug}));if(r.error){q('message').textContent=r.error.message;return}q('categoryModal').style.display='none';q('name').value='';q('slug').value='';load()};load()})();</script></body></html>
