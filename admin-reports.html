<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PanamaXChange — Reports</title><link rel="stylesheet" href="admin.css?v=20260821-16"></head>
<body><div class="wrap"><header class="head"><div><div class="eyebrow">ADMIN REPORTING</div><h1>Marketplace Reports</h1><p>Revenue, orders, products, stock and activity reporting.</p></div><div class="actions"><a class="btn" href="admin.html?v=20260821-16">← Admin dashboard</a><button class="btn" id="exportBtn" type="button">Export CSV</button></div></header><section class="filters"><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label><label>Order status<select id="status"><option value="">All statuses</option><option>pending</option><option>paid</option><option>processing</option><option>shipped</option><option>completed</option><option>cancelled</option></select></label><label>Search<input id="search" placeholder="Order ID or customer"></label></section><section class="metrics"><div class="card metric"><small>Orders</small><strong id="orders">—</strong></div><div class="card metric"><small>Revenue</small><strong id="revenue">—</strong></div><div class="card metric"><small>Products</small><strong id="products">—</strong></div><div class="card metric"><small>Stock units</small><strong id="stock">—</strong></div></section><section class="card"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Status</th><th>Total</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading report…</td></tr></tbody></table></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-auth.js?v=20260821-16"></script><script>
/** Admin Reports controller: reuse the canonical Admin client and session so Reports cannot drift to a stale API key or duplicate auth storage. */
(()=>{let db=null,orders=[],products=[];const $=id=>document.getElementById(id),money=v=>`$${Number(v||0).toFixed(2)}`,esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));async function load(){db=await window.PanamaAdminAuth.ready;if(!db)throw new Error('Admin authentication is unavailable.');const s=await db.auth.getSession();if(!s.data?.session)throw new Error('Admin session expired. Please sign in again.');const[o,p]=await Promise.all([db.from('orders').select('id,customer_name,customer_email,status,total,created_at').order('created_at',{ascending:false}).limit(1000),db.from('products').select('id,stock')]);if(o.error)throw o.error;if(p.error)throw p.error;orders=o.data||[];products=p.data||[];render()}function filtered(){const f=$('from').value,t=$('to').value,s=$('status').value,q=$('search').value.trim().toLowerCase();return orders.filter(o=>{const d=String(o.created_at).slice(0,10);return(!f||d>=f)&&(!t||d<=t)&&(!s||o.status===s)&&(!q||`${o.id} ${o.customer_name||''} ${o.customer_email||''}`.toLowerCase().includes(q))})}function render(){const list=filtered();$('orders').textContent=list.length;$('revenue').textContent=money(list.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+Number(o.total||0),0));$('products').textContent=products.length;$('stock').textContent=products.reduce((a,p)=>a+Number(p.stock||0),0);$('rows').innerHTML=list.length?list.map(o=>`<tr><td>#${esc(o.id)}</td><td>${esc(o.customer_name||o.customer_email||'Guest')}</td><td>${esc(new Date(o.created_at).toLocaleString())}</td><td>${esc(o.status||'')}</td><td>${money(o.total)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No records match the selected filters.</td></tr>'}function exportCsv(){const list=filtered(),rows=[['Order','Customer','Email','Date','Status','Total'],...list.map(o=>[o.id,o.customer_name||'',o.customer_email||'',o.created_at,o.status||'',Number(o.total||0).toFixed(2)])],csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),a=document.createElement('a'),href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=href;a.download=`panamaxchange-orders-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(href),0)}['from','to','status','search'].forEach(id=>$(id).addEventListener('input',render));$('exportBtn').addEventListener('click',exportCsv);load().catch(e=>{$('rows').innerHTML=`<tr><td colspan="5" class="empty">Unable to load report: ${esc(e.message||e)}</td></tr>`})})();
</script></body></html>
