<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NovaShop Admin</title>

    <style>
.product-form {
    background: #f7f7f7;

    padding: 25px;

    border-radius: 12px;

    margin-bottom: 30px;
}

.product-form form {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;
}

.product-form label {
    margin: 0;
}

.product-form button {
    margin-top: 10px;
}

.product-table img {
    width: 60px;

    height: 60px;

    object-fit: cover;

    border-radius: 8px;
}

.danger {
    background: #dc3545;
}

.danger:hover {
    background: #b52a37;
}

.edit-button {
    background: #555;
}

@media(max-width:700px) {

    .product-form form {
        grid-template-columns: 1fr;
    }

}
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f7;

            color: #171717;
        }

        .header {
            background: #111;
            color: white;

            padding: 20px 5%;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
        }

        .logo span {
            color: #635bff;
        }

        .container {
            width: min(1200px, 92%);

            margin: 40px auto;
        }

        .login,
        .dashboard {
            background: white;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.06);
        }

        .login {
            max-width: 450px;

            margin: 80px auto;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        label {
            display: block;

            margin-bottom: 15px;

            font-weight: 600;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            margin-top: 7px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font: inherit;
        }

        button {
            border: none;

            border-radius: 8px;

            padding: 11px 17px;

            background: #635bff;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #5149e6;
        }

        .logout {
            background: #333;
        }

        .message {
            margin-top: 15px;

            color: #d32f2f;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin: 25px 0;
        }

        .stat {
            padding: 25px;

            background: #f7f7f7;

            border-radius: 12px;
        }

        .stat strong {
            display: block;

            font-size: 30px;

            margin-top: 8px;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;

            text-align: left;

            border-bottom:
                1px solid #eee;
        }

        .hidden {
            display: none;
        }

        @media(max-width:700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            table {
                display: block;

                overflow-x: auto;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">
        Nova<span>Shop</span> Admin
    </div>

    <button
        id="logoutButton"
        class="logout hidden"
    >
        Logout
    </button>

</header>


<main class="container">


    <!-- LOGIN -->

    <section
        id="loginSection"
        class="login"
    >

        <h1>Admin Login</h1>

        <p>
            Sign in to manage your store.
        </p>


        <form id="loginForm">

            <label>

                Email

                <input
                    type="email"
                    id="email"
                    required
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    id="password"
                    required
                >

            </label>


            <button type="submit">
                Login
            </button>

        </form>


        <p
            id="loginMessage"
            class="message"
        ></p>

    </section>


    <!-- DASHBOARD -->

    <section
        id="dashboard"
        class="dashboard hidden"
    >

        <h1>Dashboard</h1>

        <p>
            Welcome to your store administration.
        </p>


        <div class="stats">

            <div class="stat">

                Products

                <strong id="productCount">
                    0
                </strong>

            </div>


            <div class="stat">

                Orders

                <strong id="orderCount">
                    0
                </strong>

            </div>


            <div class="stat">

                Revenue

                <strong id="revenue">
                    $0.00
                </strong>

            </div>

        </div>
<h2>Products</h2>

<div class="product-form">

    <form id="productForm">

        <input
            type="hidden"
            id="productId"
        >

        <label>
            Product name

            <input
                type="text"
                id="productName"
                required
            >
        </label>


        <label>
            Description

            <input
                type="text"
                id="productDescription"
            >
        </label>


        <label>
            Price

            <input
                type="number"
                id="productPrice"
                step="0.01"
                min="0"
                required
            >
        </label>


        <label>
            Category

            <input
                type="text"
                id="productCategory"
                placeholder="electronics"
                required
            >
        </label>


        <label>
            Stock

            <input
                type="number"
                id="productStock"
                min="0"
                required
            >
        </label>


        <label>
            Image URL

            <input
                type="url"
                id="productImage"
                placeholder="https://..."
            >
        </label>


        <button type="submit">
            Add Product
        </button>

        <button
            type="button"
            id="cancelEdit"
            class="hidden"
        >
            Cancel Edit
        </button>

    </form>

</div>


<h2>Product List</h2>

<div id="productsContainer">
    Loading products...
</div>

        <h2>Recent Orders</h2>

        <div id="ordersContainer">
            Loading...
        </div>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://tagbxmpizwlvgddgcpcl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_X36Iq53rm8U8HBkBfL06Vw_zErQRHK0";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginSection =
    document.getElementById(
        "loginSection"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


async function checkLogin() {

    const {
        data
    } = await supabaseClient
        .auth
        .getSession();


    if (data.session) {

        showDashboard();

    }

}


async function login(
    email,
    password
) {

    const {
        error
    } = await supabaseClient
        .auth
        .signInWithPassword({

            email,
            password

        });


    if (error) {

        loginMessage.textContent =
            error.message;

        return;

    }


    showDashboard();

}


async function logout() {

    await supabaseClient
        .auth
        .signOut();


    dashboard.classList.add(
        "hidden"
    );

    loginSection.classList.remove(
        "hidden"
    );

    logoutButton.classList.add(
        "hidden"
    );

}


async function showDashboard() {

    loginSection.classList.add(
        "hidden"
    );

    dashboard.classList.remove(
        "hidden"
    );

    logoutButton.classList.remove(
        "hidden"
    );


    await loadDashboard();
    await loadProducts();

}


async function loadDashboard() {

    const {
        count: productCount
    } = await supabaseClient
        .from("products")
        .select(
            "*",
            {
                count: "exact",
                head: true
            }
        );


    const {
        data: orders,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        return;

    }


    document.getElementById(
        "productCount"
    ).textContent =
        productCount || 0;


    document.getElementById(
        "orderCount"
    ).textContent =
        orders.length;


    const revenue =
        orders.reduce(
            (
                total,
                order
            ) =>
                total +
                Number(order.total),
            0
        );


    document.getElementById(
        "revenue"
    ).textContent =
        "$" +
        revenue.toFixed(2);


    displayOrders(
        orders
    );

}


function displayOrders(
    orders
) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    if (orders.length === 0) {

        container.innerHTML =
            "<p>No orders yet.</p>";

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Customer</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Date</th>

                </tr>

            </thead>

            <tbody>

    `;


    orders.forEach(
        order => {

            html += `

                <tr>

                    <td>
                        #${order.id}
                    </td>

                    <td>
                        ${order.customer_name}
                    </td>

                    <td>
                        $${Number(
                            order.total
                        ).toFixed(2)}
                    </td>

                    <td>
                        ${order.status}
                    </td>

                    <td>
                        ${new Date(
                            order.created_at
                        ).toLocaleDateString()}
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        html;

}


loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        await login(

            document
                .getElementById(
                    "email"
                )
                .value,

            document
                .getElementById(
                    "password"
                )
                .value

        );

    }
);


logoutButton.addEventListener(
    "click",
    logout
);

    // ==========================================
// PRODUCT MANAGEMENT
// ==========================================

const productForm =
    document.getElementById(
        "productForm"
    );

const productsContainer =
    document.getElementById(
        "productsContainer"
    );

const cancelEdit =
    document.getElementById(
        "cancelEdit"
    );


async function loadProducts() {

    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .order(
            "id",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        productsContainer.innerHTML =
            `<p>${error.message}</p>`;

        return;

    }


    displayAdminProducts(data);

}


function displayAdminProducts(
    products
) {

    if (products.length === 0) {

        productsContainer.innerHTML =
            "<p>No products yet.</p>";

        return;

    }


    let html = `

        <table class="product-table">

            <thead>

                <tr>

                    <th>Image</th>

                    <th>Name</th>

                    <th>Price</th>

                    <th>Category</th>

                    <th>Stock</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

    `;


    products.forEach(
        product => {

            html += `

                <tr>

                    <td>

                        ${
                            product.image_url

                            ? `<img
                                src="${product.image_url}"
                                alt="${product.name}"
                              >`

                            : "🛍️"
                        }

                    </td>


                    <td>
                        ${product.name}
                    </td>


                    <td>
                        $${Number(
                            product.price
                        ).toFixed(2)}
                    </td>


                    <td>
                        ${product.category}
                    </td>


                    <td>
                        ${product.stock ?? 0}
                    </td>


                    <td>

                        <button
                            class="edit-button"
                            onclick='editProduct(
                                ${JSON.stringify(product)}
                            )'
                        >
                            Edit
                        </button>


                        <button
                            class="danger"
                            onclick="deleteProduct(
                                ${product.id}
                            )"
                        >
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    productsContainer.innerHTML =
        html;

}


// ------------------------------------------
// ADD / EDIT PRODUCT
// ------------------------------------------

productForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const productId =
            document.getElementById(
                "productId"
            ).value;


        const product = {

            name:
                document.getElementById(
                    "productName"
                ).value.trim(),

            description:
                document.getElementById(
                    "productDescription"
                ).value.trim(),

            price:
                Number(
                    document.getElementById(
                        "productPrice"
                    ).value
                ),

            category:
                document.getElementById(
                    "productCategory"
                ).value.trim(),

            stock:
                Number(
                    document.getElementById(
                        "productStock"
                    ).value
                ),

            image_url:
                document.getElementById(
                    "productImage"
                ).value.trim()

        };


        let result;


        if (productId) {

            result =
                await supabaseClient
                    .from("products")
                    .update(product)
                    .eq(
                        "id",
                        productId
                    );

        } else {

            result =
                await supabaseClient
                    .from("products")
                    .insert(product);

        }


        if (result.error) {

            console.error(
                result.error
            );

            alert(
                "Could not save product: " +
                result.error.message
            );

            return;

        }


        alert(
            productId
                ? "Product updated!"
                : "Product added!"
        );


        resetProductForm();

        await loadProducts();

        await loadDashboard();

    }
);


// ------------------------------------------
// EDIT PRODUCT
// ------------------------------------------

function editProduct(
    product
) {

    document.getElementById(
        "productId"
    ).value =
        product.id;


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price;


    document.getElementById(
        "productCategory"
    ).value =
        product.category || "";


    document.getElementById(
        "productStock"
    ).value =
        product.stock || 0;


    document.getElementById(
        "productImage"
    ).value =
        product.image_url || "";


    productForm.querySelector(
        "button[type='submit']"
    ).textContent =
        "Update Product";


    cancelEdit.classList.remove(
        "hidden"
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ------------------------------------------
// CANCEL EDIT
// ------------------------------------------

cancelEdit.addEventListener(
    "click",
    resetProductForm
);


function resetProductForm() {

    productForm.reset();


    document.getElementById(
        "productId"
    ).value = "";


    productForm.querySelector(
        "button[type='submit']"
    ).textContent =
        "Add Product";


    cancelEdit.classList.add(
        "hidden"
    );

}


// ------------------------------------------
// DELETE PRODUCT
// ------------------------------------------

async function deleteProduct(
    productId
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } = await supabaseClient
        .from("products")
        .delete()
        .eq(
            "id",
            productId
        );


    if (error) {

        alert(
            "Could not delete product: " +
            error.message
        );

        return;

    }


    alert(
        "Product deleted."
    );


    await loadProducts();

    await loadDashboard();

}

checkLogin();

</script>


</body>

</html>
