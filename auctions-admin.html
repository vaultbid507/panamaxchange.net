<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — Auction Admin</title><link rel="stylesheet" href="admin.css?v=20260818-04"><link rel="stylesheet" href="auction-admin.css?v=20260818-04"></head><body><section id="loginSection" class="login-page"><div class="login-card"><div class="brand"><div class="brand-logo">P</div><div><h1>PanamaXChange</h1><p>Auction Admin</p></div></div><form id="loginForm" class="login-form"><div class="form-group"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary-button" type="submit">Login</button></form><div id="loginMessage" class="message"></div></div></section><section id="dashboard" class="dashboard hidden"><header class="admin-header"><div class="brand compact"><div class="brand-logo">P</div><div><h1>PanamaXChange</h1><p>Auction Admin</p></div></div><button id="logout" class="secondary-button" type="button">Logout</button></header><main class="admin-main"><div class="page-heading"><div><span class="eyebrow">AUCTIONS</span><h2>Manage bidding</h2><p>Create, edit, start and close auctions.</p></div><a href="bidding.html" class="secondary-button">View live auctions →</a></div><section class="auction-admin-grid"><div class="form-card"><h3>Create / Edit auction</h3><form id="auctionForm" class="admin-form"><input id="auctionId" type="hidden"><div class="form-group"><label>Product</label><select id="productId" required></select></div><div class="form-group"><label>Title</label><input id="title" maxlength="160" required></div><div class="form-group"><label>Description</label><textarea id="description" rows="3"></textarea></div><div class="form-row"><div class="form-group"><label>Starts</label><input id="startsAt" type="datetime-local" required></div><div class="form-group"><label>Ends</label><input id="endsAt" type="datetime-local" required></div></div><div class="form-row"><div class="form-group"><label>Starting bid</label><input id="startingBid" type="number" min="0" step="0.01" value="0" required></div><div class="form-group"><label>Minimum increment</label><input id="increment" type="number" min="0.01" step="0.01" value="1" required></div></div><div class="form-group"><label>Status</label><select id="status"><option value="scheduled">Scheduled</option><option value="live">Live</option><option value="cancelled">Cancelled</option><option value="ended">Ended</option></select></div><button class="primary-button" type="submit">Save auction</button></form></div><div class="list-card"><div class="list-header"><h3>Auctions</h3></div><div id="auctionList" class="auction-admin-list">Loading auctions...</div></div></section></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auctions-admin.js?v=20260818-04"></script></body></html>
