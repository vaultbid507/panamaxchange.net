<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PanamaXChange — Auction Management</title><link rel="stylesheet" href="admin.css?v=20260819-01"><link rel="stylesheet" href="auction-admin.css?v=20260819-01"></head><body class="auction-page"><main class="auction-shell"><header class="auction-header"><div><div class="auction-brand">Panama<span>X</span>Change</div><div class="auction-sub">Professional live auction management</div></div><div class="actions"><a class="btn" href="admin.html?v=20260819-01">← Admin dashboard</a><a class="btn" href="bidding-unified.html">View live auctions →</a><button class="btn" id="logout" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total auctions</small><strong id="auctionTotal">0</strong></div><div class="card"><small>Live</small><strong id="auctionLive">0</strong></div><div class="card"><small>Scheduled</small><strong id="auctionScheduled">0</strong></div><div class="card"><small>Ended</small><strong id="auctionEnded">0</strong></div></section><section class="card"><div class="toolbar"><input id="auctionSearch" type="search" placeholder="Search auction or product"><select id="auctionFilter"><option value="">All statuses</option><option value="live">Live</option><option value="scheduled">Scheduled</option><option value="ended">Ended</option><option value="cancelled">Cancelled</option></select><button class="btn" id="refreshAuctions" type="button">Refresh</button><button class="btn primary" id="newAuction" type="button">+ New auction</button></div><div id="auctionFormPanel" class="form-panel hidden"><h3 id="auctionFormTitle">Add auction</h3><form id="auctionForm" class="auction-form"><input id="auctionId" type="hidden"><div class="form-grid"><select id="productId" required><option value="">Loading products...</option></select><inp
