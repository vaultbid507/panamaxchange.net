<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PanamaXChange — Product Management</title><link rel="stylesheet" href="admin.css?v=20260821-04"><style>.products-page{min-height:100vh;background:#f6f9fc;color:#142033}.products-shell{max-width:1400px;margin:auto;padding:28px}.products-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.products-brand{font-size:24px;font-weight:800}.products-brand span{color:#2563eb}.products-sub{color:#64748b;margin-top:5px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px 14px;border:1px solid #d7e0eb;border-radius:10px;background:#fff}.toolbar input{min-width:280px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.card small{display:block;color:#64748b}.card strong{display:block;font-size:26px;margin-top:7px}.table-card{overflow:auto}.products-table{width:100%;border-collapse:collapse;background:#fff}.products-table th,.products-table td{padding:15px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}.products-table th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d5deea;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600;text-decoration:none;color:#263449}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}.edit-input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.empty{text-align:center;padding:45px;color:#64748b}.error{padding:20px;color:#b42318;background:#fff1f2;border-radius:10px}.hidden{display:none!important}.product-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px;z-index:5000}.product-modal.hidden{display:none}.product-modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #e1e8f0;border-radius:20px;box-shadow:0 30px 90px rgba(15,23,42,.22)}.product-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid #edf1f5}.product-modal-head h2{margin:0;font-size:20px}.product-modal-head p{margin:5px 0 0;color:#64748b;font-size:12px}.product-modal-close{border:0;background:#f3f6fa;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}.product-modal-body{padding:24px}.modal-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.modal-field{display:grid;gap:7px}.modal-field.full{grid-column:1/-1}.modal-field label{font-size:12px;font-weight:700;color:#475569}.modal-field input,.modal-field textarea{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d7e0eb;border-radius:10px;font:inherit}.modal-field textarea{min-height:100px;resize:vertical}.product-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;padding-top:18px;border-top:1px solid #edf1f5}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.products-shell{padding:16px}.products-header{align-items:flex-start;flex-direction:column}.modal-form-grid{grid-template-columns:1fr}.modal-field.full{grid-column:auto}}@media(max-width:500px){.cards{grid-template-columns:1fr}.product-modal{padding:10px}.product-modal-card{max-height:94vh}}</style></head><body class="products-page"><main class="products-shell"><header class="products-header"><div><div class="products-brand">Panama<span>X</span>Change</div><div class="products-sub">Professional product, pricing &amp; stock management</div></div><div class="actions"><a class="btn" href="admin.html?v=20260821-04">← Admin dashboard</a><button class="btn" id="logout" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total products</small><strong id="total">0</strong></div><div class="card"><small>In stock</small><strong id="inStock">0</strong></div><div class="card"><small>Low stock</small><strong id="low">0</strong></div><div class="card"><small>Out of stock</small><strong id="out">0</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search product or category"><select id="stock"><option value="">All stock</option><option value="in">In stock</option><option value="low">Low stock ≤ 5</option><option value="out">Out of stock</option></select><button id="refresh" class="btn">Refresh</button><button id="new" class="btn primary" type="button">+ New product</button></div><div class="table-card"><table class="products-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>State</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading products...</td></tr></tbody></table></div></section></main><div id="productCreateModal" class="product-modal hidden" role="dialog" aria-modal="true" aria-labelledby="productCreateTitle"><div class="product-modal-card"><div class="product-modal-head"><div><h2 id="productCreateTitle">Create new product</h2><p>Add a product to the PanamaXChange storefront.</p></div><button id="closeProductCreate" class="product-modal-close" type="button" aria-label="Close">✕</button></div><div class="product-modal-body"><div class="modal-form-grid"><div class="modal-field"><label for="name">Product name</label><input id="name" placeholder="Product name"></div><div class="modal-field"><label for="category">Category</label><input id="category" placeholder="Category"></div><div class="modal-field"><label for="price">Price</label><input id="price" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="modal-field"><label for="quantity">Stock</label><input id="quantity" type="number" min="0" step="1" placeholder="0"></div><div class="modal-field full"><label for="image">Image URL</label><input id="image" placeholder="https://..."></div><div class="modal-field full"><label for="description">Description</label><textarea id="description" placeholder="Describe the product"></textarea></div></div><div class="product-modal-actions"><button id="cancelNew" class="btn" type="button">Cancel</button><button id="saveNew" class="btn primary" type="button">Create product</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-auth.js?v=20260821-04"></script><script src="products-admin.js?v=20260821-04"></script></body></html>
