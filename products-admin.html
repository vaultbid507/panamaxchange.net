<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — Product Management</title><link rel="stylesheet" href="admin.css?v=20260815-14"><style>body{margin:0;background:#f6f9fc;color:#142033}.products-shell{max-width:1450px;margin:auto;padding:28px}.products-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{font-size:25px;font-weight:800}.brand span{color:#2563eb}.sub{color:#64748b;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d6e0ea;background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:650;text-decoration:none;color:#172033}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.card small{color:#64748b}.card strong{display:block;font-size:27px;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{padding:11px 13px;border:1px solid #d6e0ea;border-radius:9px;background:#fff}.toolbar input{min-width:300px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}.table th{background:#f8fafc;color:#64748b;font-size:12px;text-transform:uppercase}.edit-input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.row-edit{background:#f8fbff}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef6ff;color:#1859a9;font-size:12px}.empty{text-align:center;padding:45px;color:#64748b}.error{color:#b42318;background:#fff1f2;padding:18px;border-radius:10px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.products-shell{padding:16px}.products-header{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><main class="products-shell"><header class="products-header"><div><div class="brand">Panama<span>X</span>Change</div><div class="sub">Professional product & inventory management</div></div><div class="actions"><a class="btn" href="admin.html">← Admin dashboard</a><button id="logout" class="btn">Sign out</button></div></header><section class="stats"><div class="card"><small>Total products</small><strong id="total">0</strong></div><div class="card"><small>In stock</small><strong id="inStock">0</strong></div><div class="card"><small>Low stock</small><strong id="low">0</strong></div><div class="card"><small>Out of stock</small><strong id="out">0</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search product or category"><select id="stock"><option value="">All stock</option><option value="in">In stock</option><option value="low">Low stock ≤ 5</option><option value="out">Out of stock</option></select><button id="refresh" class="btn">Refresh</button><button id="new" class="btn primary">+ New product</button></div><div id="form" hidden style="margin-bottom:18px"><div class="card"><h3 id="formTitle">New product</h3><div class="toolbar"><input id="name" placeholder="Product name"><input id="category" placeholder="Category"><input id="price" type="number" min="0" step="0.01" placeholder="Price"><input id="quantity" type="number" min="0" step="1" placeholder="Stock"></div><div class="toolbar"><input id="image" placeholder="Image URL"><input id="description" placeholder="Description" style="min-width:400px"><button id="saveNew" class="btn primary">Save product</button><button id="cancelNew" class="btn">Cancel</button></div><div id="message"></div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>State</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading products...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="products-admin.js?v=20260815-14"></script></body></html>
