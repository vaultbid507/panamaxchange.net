<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PanamaXChange — Product Management</title><link rel="stylesheet" href="admin.css?v=20260818-15"><style>.products-page{min-height:100vh;background:#f6f9fc;color:#142033}.products-shell{max-width:1400px;margin:auto;padding:28px}.products-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.products-brand{font-size:24px;font-weight:800}.products-brand span{color:#2563eb}.products-sub{color:#64748b;margin-top:5px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px 14px;border:1px solid #d7e0eb;border-radius:10px;background:#fff}.toolbar input{min-width:280px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.card small{display:block;color:#64748b}.card strong{display:block;font-size:26px;margin-top:7px}.table-card{overflow:auto}.products-table{width:100%;border-collapse:collapse;background:#fff}.products-table th,.products-table td{padding:15px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}.products-table th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}.muted{display:block;color:#718096;font-size:12px;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d5deea;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}.edit-input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.editing{background:#f8fbff}.empty{text-align:center;padding:45px;color:#64748b}.error{padding:20px;color:#b42318;background:#fff1f2;border-radius:10px}.form-panel{margin-bottom:18px;padding:18px;border:1px solid #e1e8f0;border-radius:14px;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form-grid input{padding:11px 12px;border:1px solid #d7e0eb;border-radius:10px}.form-actions{display:flex;gap:8px;align-items:end}.hidden{display:none!important}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.products-shell{padding:16px}.products-header{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body class="products-page"><main class="products-shell"><header class="products-header"><div><div class="products-brand">Panama<span>X</span>Change</div><div class="products-sub">Professional product & inventory management</div></div><div class="actions"><a class="btn" href="admin.html?v=20260818-15">← Admin dashboard</a><button class="btn" id="logout" type="button">Sign out</button></div></header><section class="cards"><div class="card"><small>Total products</small><strong id="total">0</strong></div><div class="card"><small>In stock</small><strong id="inStock">0</strong></div><div class="card"><small>Low stock</small><strong id="low">0</strong></div><div class="card"><small>Out of stock</small><strong id="out">0</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search product or category"><select id="stock"><option value="">All stock</option><option value="in">In stock</option><option value="low">Low stock ≤ 5</option><option value="out">Out of stock</option></select><button id="refresh" class="btn">Refresh</button><button id="new" class="btn primary">+ New product</button></div><div id="form" class="form-panel hidden"><div class="form-grid"><input id="name" placeholder="Product name"><input id="category" placeholder="Category"><input id="price" type="number" min="0" step="0.01" placeholder="Price"><input id="quantity" type="number" min="0" step="1" placeholder="Stock"><input id="image" placeholder="Image URL"><input id="description" placeholder="Description"><div class="form-actions"><button id="saveNew" class="btn primary">Save product</button><button id="cancelNew" class="btn">Cancel</button></div></div></div><div class="table-card"><table class="products-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>State</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading products...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="products-admin.js?v=20260818-15"></script></body></html>
