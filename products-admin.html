<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PanamaXChange — Product Management</title><link rel="stylesheet" href="admin.css?v=20260818-04"></head><body><main class="products-shell"><header class="products-header"><div><div class="brand">Panama<span>X</span>Change</div><div class="sub">Professional product & inventory management</div></div><div class="actions"><a class="btn" href="admin.html?v=20260818-04">← Admin dashboard</a><button id="logout" class="btn" type="button">Sign out</button></div></header><section class="stats"><div class="card"><small>Total products</small><strong id="total">0</strong></div><div class="card"><small>In stock</small><strong id="inStock">0</strong></div><div class="card"><small>Low stock</small><strong id="low">0</strong></div><div class="card"><small>Out of stock</small><strong id="out">0</strong></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Search product or category"><select id="stock"><option value="">All stock</option><option value="in">In stock</option><option value="low">Low stock ≤ 5</option><option value="out">Out of stock</option></select><button id="refresh" class="btn">Refresh</button><button id="new" class="btn primary">+ New product</button></div><div id="form" hidden style="margin-bottom:18px"><div class="card"><h3 id="formTitle">New product</h3><div class="toolbar"><input id="name" placeholder="Product name"><input id="category" placeholder="Category"><input id="price" type="number" min="0" step="0.01" placeholder="Price"><input id="quantity" type="number" min="0" step="1" placeholder="Stock"></div><div class="toolbar"><input id="image" placeholder="Image URL"><input id="description" placeholder="Description" style="min-width:400px"><button id="saveNew" class="btn primary">Save product</button><button id="cancelNew" class="btn">Cancel</button></div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>State</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading products...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="products-admin.js?v=20260818-04"></script></body></html>
